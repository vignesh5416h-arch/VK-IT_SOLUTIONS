{% extends 'base.html' %}{% block title %}Apply Leave{% endblock %}{% block content %}<section class="section"><div class="container"><h1>Leave Management</h1><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><div class="form-grid"><label>Type<select name="leave_type"><option>casual</option><option>sick</option><option>earned</option><option>personal</option></select></label><label>Start Date<input type="date" name="start_date" required></label><label>End Date<input type="date" name="end_date" required></label><label>Reason<textarea name="reason" required></textarea></label></div><button class="btn primary">Submit Request</button></form></div><div class="table-wrap"><table><tr><th>Type</th><th>Dates</th><th>Status</th><th>Reason</th></tr>{% for l in leaves %}<tr><td>{{l.leave_type|title}}</td><td>{{l.start_date}} → {{l.end_date}}</td><td>{{l.status|title}}</td><td>{{l.reason}}</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
