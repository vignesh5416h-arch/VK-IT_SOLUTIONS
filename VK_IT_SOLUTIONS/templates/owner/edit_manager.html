{% extends "base.html" %}
{% block title %}Edit Manager{% endblock %}
{% block content %}
<div class="dashboard-shell"><aside class="sidebar"><h3>OWNER PANEL</h3><a href="{{ url_for('owner_dashboard') }}">Dashboard</a><a class="active" href="{{ url_for('owner_managers') }}">Managers</a><a href="{{ url_for('create_manager') }}">Create Manager</a><a href="{{ url_for('owner_employees') }}">Employees</a></aside>
<section class="dashboard-main"><div class="form-card"><h1>Edit Manager</h1><p>Leave password fields empty to keep the current password.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
<label>Full Name<input name="name" value="{{ manager.name }}" required></label><label>Gmail Address<input type="email" name="email" value="{{ manager.email }}" required></label>
<label>New Password<input type="password" name="password" minlength="8"></label><label>Confirm New Password<input type="password" name="confirm_password" minlength="8"></label>
<label>Phone Number<input name="phone" value="{{ manager.phone or '' }}"></label><label>Department<input name="department" value="{{ manager.department or '' }}"></label><label>Designation<input name="designation" value="{{ manager.designation or '' }}"></label>
</div><button class="btn primary" type="submit">Save Changes</button></form></div></section></div>
{% endblock %}
