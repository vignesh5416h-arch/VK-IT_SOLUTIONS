{% extends "base.html" %}
{% block title %}Contact | VK IT SOLUTIONS{% endblock %}
{% block content %}
<section class="page-hero"><div class="container"><span class="eyebrow">CONTACT</span><h1>Let's build better operations.</h1></div></section>
<section class="section"><div class="container form-card narrow">
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Name<input name="name" required></label>
<label>Email<input name="email" type="email" required></label>
<label>Message<textarea name="message" rows="6" required></textarea></label>
<button class="btn primary" type="submit">Send Message</button>
</form>
</div></section>
{% endblock %}
