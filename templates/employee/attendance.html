{% extends 'base.html' %}{% block title %}My Attendance{% endblock %}{% block content %}<section class="section"><div class="container"><h1>My Attendance</h1><div class="table-wrap"><table><tr><th>Date</th><th>Status</th><th>Check In</th><th>Check Out</th><th>Notes</th></tr>{% for r in records %}<tr><td>{{r.date}}</td><td>{{r.status|title}}</td><td>{{r.check_in or '—'}}</td><td>{{r.check_out or '—'}}</td><td>{{r.notes or '—'}}</td></tr>{% endfor %}</table></div></div></section>{% endblock %}
