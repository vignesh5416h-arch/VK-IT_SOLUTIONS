{% extends "base.html" %}
{% block title %}Employee Profile{% endblock %}
{% block content %}
<div class="dashboard-shell"><aside class="sidebar"><h3>EMPLOYEE PANEL</h3><a href="{{ url_for('employee_dashboard') }}">Dashboard</a><a href="{{ url_for('employee_tasks') }}">My Tasks</a><a class="active" href="{{ url_for('employee_profile') }}">My Profile</a></aside>
<section class="dashboard-main"><div class="form-card"><h1>My Profile</h1><p>Employees can update permitted profile information only.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>Full Name<input name="name" value="{{ employee.name }}" required></label><label>Gmail<input value="{{ employee.email }}" disabled></label><label>Phone<input name="phone" value="{{ employee.phone or '' }}"></label><label>Department<input value="{{ employee.department or '' }}" disabled></label><label>Designation<input value="{{ employee.designation or '' }}" disabled></label><label>Manager<input value="{{ employee.manager.name if employee.manager else 'Not assigned' }}" disabled></label></div><button class="btn primary">Save Profile</button></form></div></section></div>
{% endblock %}
