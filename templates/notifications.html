{% extends 'base.html' %}{% block title %}Notifications{% endblock %}{% block content %}<section class="section"><div class="container narrow"><span class="eyebrow">NOTIFICATIONS</span><h1>Notifications</h1>{% for n in notifications %}<div class="info-card notification-card {{'unread' if not n.is_read else ''}}"><div><h3>{{n.title}}</h3><p>{{n.message}}</p><small>{{n.created_at}}</small></div>{% if not n.is_read %}<form method="post" action="{{url_for('notification_read',nid=n.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="btn small">Mark Read</button></form>{% endif %}</div>{% else %}<div class="info-card">No notifications.</div>{% endfor %}</div></section>{% endblock %}
