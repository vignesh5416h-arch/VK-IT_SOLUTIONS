{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}
{% block content %}
<div class="dashboard-shell"><aside class="sidebar"><h3>OWNER PANEL</h3><a href="{{ url_for('owner_dashboard') }}">Dashboard</a><a href="{{ url_for('owner_managers') }}">Managers</a><a href="{{ url_for('owner_employees') }}">Employees</a></aside>
<section class="dashboard-main"><div class="form-card"><h1>Edit Employee</h1><p>Update details, assignment or password.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
<label>Full Name<input name="name" value="{{ employee.name }}" required></label><label>Gmail Address<input type="email" name="email" value="{{ employee.email }}" required></label>
<label>Password<input type="password" name="password" minlength="8"></label><label>Confirm Password<input type="password" name="confirm_password" minlength="8"></label>
<label>Phone Number<input name="phone" value="{{ employee.phone or '' }}"></label><label>Department<input name="department" value="{{ employee.department or '' }}"></label><label>Designation<input name="designation" value="{{ employee.designation or '' }}"></label>
<label>Assign Manager<select name="manager_id" required>{% for m in managers %}<option value="{{ m.id }}" {% if employee.manager_id == m.id %}selected{% endif %}>{{ m.name }} — {{ m.department or 'General' }}</option>{% endfor %}</select></label>
</div><button class="btn primary" type="submit">Save Changes</button></form></div></section></div>
{% endblock %}
